name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: warp-tui

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: x86_64-linux
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            asset: aarch64-linux
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            asset: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            asset: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            asset: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          - target: aarch64-pc-windows-msvc
            asset: aarch64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install aarch64 linker
        if: matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross linker
        if: matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bin ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="${{ env.BIN_NAME }}-${{ env.VERSION }}-${{ matrix.asset }}"
          mkdir -p "$staging" out
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$staging/"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "out/${staging}"
          cp README.md LICENSE "$staging/" 2>/dev/null || true
          zip -r "out/${staging}.zip" "$staging"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "${{ env.BIN_NAME }}-${{ env.VERSION }}-${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $staging, out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" -Destination $staging
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" -Destination "out/${staging}.exe"
          if (Test-Path README.md) { Copy-Item README.md -Destination $staging }
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination $staging }
          Compress-Archive -Path $staging -DestinationPath "out/${staging}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
